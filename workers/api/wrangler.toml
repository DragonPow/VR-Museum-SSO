name                = "virtual-museum-api"
main                = "src/index.ts"
compatibility_date  = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# R2 bucket
[[r2_buckets]]
binding     = "MEDIA_BUCKET"
bucket_name = "virtual-museum-media"

# D1 Database (visitor counter)
[[d1_databases]]
binding       = "DB"
database_name = "virtual-museum-db"
database_id   = "6c892e38-4091-4b2d-8380-7265c345ce0c"

# Non-secret vars
[vars]
# Origins allowed to call this Worker (CORS). Separate multiple origins with comma.
ALLOWED_ORIGIN = "https://virtual-museum-admin.pages.dev,https://virtual-museum-web.pages.dev"
# Public base URL for R2 (set after enabling R2 public access)
# e.g. https://pub-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.r2.dev
PUBLIC_R2_URL  = ""

# Local dev overrides
[env.dev]
name = "virtual-museum-api-dev"

[[env.dev.r2_buckets]]
binding             = "MEDIA_BUCKET"
bucket_name         = "virtual-museum-media"
preview_bucket_name = "virtual-museum-media-dev"

[env.dev.vars]
ALLOWED_ORIGIN = "http://localhost:5174,http://localhost:5173"
PUBLIC_R2_URL  = ""
