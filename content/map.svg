  <polygon points="82,128 85,122 88,128" fill="#ef4444" opacity="0.6" />
  <polygon points="210,39 216,42 210,45" fill="#ef4444" opacity="0.6" />
  <polygon points="332,122 335,128 338,122" fill="#ef4444" opacity="0.6" />

  <!-- Left wall sticking-out dividers (Gray) - 4 identical, thin horizontal lines -->
